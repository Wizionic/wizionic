<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatfish WASM</title>
    <base href="/" />
    <!-- Unified custom CSS (single source: design tokens + all custom styles for both hosted WASM and standalone client). -->
    <link rel="stylesheet" href="css/chatfish.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div id="app">
        <div style="display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
            Loading Chatfish WASM...
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.scrollChatToBottom = () => {
            const container = document.getElementById('chat-container');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        };

        window.isMobileViewport = () => window.innerWidth <= 640.98;

        window.getChatTextareaValue = (el) => (el && typeof el.value === 'string') ? el.value : '';

        window.resetChatTextarea = (el) => {
            if (!el) return;
            el.value = '';
        };

        window.setupChatEnterToSend = function (textareaEl) {
            if (!textareaEl || textareaEl.__chatfishEnterBound) return;
            textareaEl.__chatfishEnterBound = true;
            textareaEl.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' && !ev.shiftKey) {
                    ev.preventDefault();
                    const btn = document.getElementById('chat-send-btn');
                    if (btn) btn.click();
                }
            });
        };
    </script>
</body>

</html>
