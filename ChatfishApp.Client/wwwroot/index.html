<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatfish WASM</title>
    <base href="/" />
    <!-- Unified custom CSS (single source: design tokens + all custom styles for both hosted WASM and standalone client). -->
    <link rel="stylesheet" href="_content/ChatfishApp.Shared/css/chatfish.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div style="display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
            Loading Chatfish WASM...
        </div>
    </div>

    <div id="blazor-error-ui">

        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script src="_content/ChatfishApp.Shared/js/chatInterop.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-resize-image@1.0.11/dist/quill-resize-image.min.js"></script>

    <script src="js/cfExport.js"></script>

</html>
