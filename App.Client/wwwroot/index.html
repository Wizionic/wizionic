<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wizionic WASM</title>
    <base href="/" />
    <!-- Unified custom CSS (single source: design tokens + all custom styles for both hosted WASM and standalone client). -->
    <link rel="stylesheet" href="_content/App.Shared/css/app.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icon16.png" />
    <link rel="apple-touch-icon" href="/images/IconWhiteBG180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wizionic" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
</head>

<body>
    <div id="app">
        <div style="display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
            Loading Wizionic WASM...
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script src="_content/App.Shared/js/chatInterop.js"></script>
    <script src="_content/App.Shared/js/sidebarInterop.js"></script>
    <script src="_content/App.Shared/js/notesReorderInterop.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/quill-resize-image@1.0.11/dist/quill-resize-image.min.js"></script>
    <script src="js/quillInterop.js"></script>
    <script src="js/cfExport.js"></script>
</body>

</html>
